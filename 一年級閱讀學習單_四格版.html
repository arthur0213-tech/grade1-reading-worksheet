<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一年級閱讀學習單（四格省紙版）</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-sheet {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: none !important;
        height: 278mm !important;
      }
    }

    /* 台灣國小課本標準直式右側注音排版 */
    .zy-word {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-right: 0.12em;
      line-height: 1;
    }
    .zy-char {
      font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", "Noto Serif TC", serif;
      font-size: 1em;
      line-height: 1;
    }
    .zy-box {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      margin-left: 1px;
      height: 1.05em;
    }
    .zy-phonetics {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "DFKai-SB", "BiauKai", "標楷體", "Microsoft JhengHei", sans-serif;
      font-size: 0.32em;
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: 0;
    }
    .zy-neutral {
      font-size: 0.9em;
      line-height: 0.6;
      margin-bottom: 1px;
    }
    .zy-tone {
      font-family: "DFKai-SB", "BiauKai", "標楷體", "Microsoft JhengHei", sans-serif;
      font-size: 0.34em;
      line-height: 1;
      font-weight: 700;
      margin-left: -1px;
      align-self: center;
      transform: translateY(15%);
    }

    .print-sheet {
      background: #ffffff;
      color: #1f2937;
      width: 210mm;
      height: 290mm;
      padding: 8mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .writing-line {
      border-bottom: 1.5px dashed #9ca3af;
      height: 28px;
      position: relative;
    }
    .zhuyin-grid-row {
      display: flex;
      gap: 4px;
    }
    .zhuyin-cell {
      flex: 1;
      height: 36px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      display: flex;
    }
    .zhuyin-cell-main {
      flex: 2.2;
      border-right: 1px dashed #d1d5db;
    }
    .zhuyin-cell-side {
      flex: 1;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased p-4 md:p-6">

  <!-- 教師自訂與列印控制面板 (列印時自動隱藏) -->
  <div class="no-print max-w-4xl mx-auto mb-6 bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-3">
      <div>
        <h1 class="text-base font-bold text-slate-900">🖨️ 一年級「一頁四本」閱讀學習單產生器</h1>
        <p class="text-xs text-slate-600 mt-0.5">
          全版附標準直式注音，可依班級需求切換版型，點擊右側按鈕即可直接以 A4 列印或存成 PDF。
        </p>
      </div>
      <button onclick="window.print()" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow-sm transition cursor-pointer">
        🖨️ 直接列印 / 另存 A4 PDF
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-3 border-t border-slate-200 text-xs">
      <div>
        <label class="block font-semibold mb-1 text-slate-700">1. 記錄區版型（畫圖 vs 寫注音）</label>
        <select id="modeSelect" onchange="renderSheet()" class="w-full rounded-lg border border-slate-300 bg-white text-slate-900 px-2.5 py-1.5">
          <option value="mixed" selected>🎨 圖文並茂版（上畫圖＋下2行寫注音/造詞）</option>
          <option value="draw">🖍️ 繪畫為主版（大畫框＋底部1行寫主角/短句）</option>
          <option value="grid">✏️ 注音格子版（中畫框＋下方標準注音田字格）</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-1 text-slate-700">2. 閱讀回饋互動方式</label>
        <select id="ratingSelect" onchange="renderSheet()" class="w-full rounded-lg border border-slate-300 bg-white text-slate-900 px-2.5 py-1.5">
          <option value="faces" selected>😊 表情塗色（喜歡 / 還好 / 有點難）</option>
          <option value="stars">⭐ 星星塗色（給這本書 1～3 顆星）</option>
        </select>
      </div>

      <div>
        <label class="block font-semibold mb-1 text-slate-700">3. 使用方式</label>
        <select id="cutSelect" onchange="renderSheet()" class="w-full rounded-lg border border-slate-300 bg-white text-slate-900 px-2.5 py-1.5">
          <option value="whole" selected>📄 整張集點（集滿4本換獎勵，不裁切）</option>
          <option value="cut">✂️ 四格裁切卡（顯示中間剪刀虛線，可貼聯絡簿）</option>
        </select>
      </div>
    </div>
  </div>

  <!-- A4 學習單本體 -->
  <div class="overflow-x-auto flex justify-center">
    <div id="worksheet" class="print-sheet rounded-lg shadow-md border border-gray-300"></div>
  </div>

  <script>
    function z(text) {
      return text.replace(/([^\(\s]+)\(([^\)]+)\)/g, (_, char, zy) => {
        let neutral = '';
        let tone = '';
        let cleanZy = zy.trim();

        if (cleanZy.startsWith('˙')) {
          neutral = '˙';
          cleanZy = cleanZy.slice(1);
        }
        const lastChar = cleanZy.slice(-1);
        if (['ˊ', 'ˇ', 'ˋ'].includes(lastChar)) {
          tone = lastChar;
          cleanZy = cleanZy.slice(0, -1);
        }

        const symbols = Array.from(cleanZy)
          .map(s => `<span>${s}</span>`)
          .join('');

        return `<span class="zy-word"><span class="zy-char">${char}</span><span class="zy-box"><span class="zy-phonetics">${neutral ? `<span class="zy-neutral">˙</span>` : ''}${symbols}</span>${tone ? `<span class="zy-tone">${tone}</span>` : ''}</span></span>`;
      });
    }

    function renderCard(index, mode, ratingType) {
      const numZh = ['一(ㄧ)', '二(ㄦˋ)', '三(ㄙㄢ)', '四(ㄙˋ)'][index];

      let ratingHtml = '';
      if (ratingType === 'faces') {
        ratingHtml = `
          <div class="bg-gray-50 rounded-xl px-2.5 py-1.5 border border-gray-200 text-sm">
            <div class="font-bold text-gray-800 whitespace-nowrap mb-1">
              ${z('我(ㄨㄛˇ)覺(ㄐㄩㄝˊ)得(˙ㄉㄜ)')}：<span class="text-xs font-normal text-gray-600">（${z('請(ㄑㄧㄥˇ)圈(ㄑㄩㄢ)起(ㄑㄧˇ)來(ㄌㄞˊ)')}）</span>
            </div>
            <div class="flex items-center justify-around pt-0.5">
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-dashed border-gray-400 bg-white whitespace-nowrap">
                <span class="text-base">😊</span>${z('喜(ㄒㄧˇ)歡(ㄏㄨㄢ)')}
              </span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-dashed border-gray-400 bg-white whitespace-nowrap">
                <span class="text-base">🙂</span>${z('還(ㄏㄞˊ)好(ㄏㄠˇ)')}
              </span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-dashed border-gray-400 bg-white whitespace-nowrap">
                <span class="text-base">🤔</span>${z('有(ㄧㄡˇ)點(ㄉㄧㄢˇ)難(ㄋㄢˊ)')}
              </span>
            </div>
          </div>
        `;
      } else {
        ratingHtml = `
          <div class="bg-gray-50 rounded-xl px-2.5 py-1.5 border border-gray-200 text-sm">
            <div class="font-bold text-gray-800 whitespace-nowrap mb-1">
              ${z('我(ㄨㄛˇ)覺(ㄐㄩㄝˊ)得(˙ㄉㄜ)')}：<span class="text-xs font-normal text-gray-600">（${z('請(ㄑㄧㄥˇ)圈(ㄑㄩㄢ)起(ㄑㄧˇ)來(ㄌㄞˊ)或(ㄏㄨㄛˋ)塗(ㄊㄨˊ)顏(ㄧㄢˊ)色(ㄙㄜˋ)')}）</span>
            </div>
            <div class="flex items-center justify-around pt-0.5 text-lg leading-none text-gray-500">
              <span class="px-2 py-0.5 rounded-full border border-dashed border-gray-400 bg-white">☆</span>
              <span class="px-2 py-0.5 rounded-full border border-dashed border-gray-400 bg-white">☆☆</span>
              <span class="px-2 py-0.5 rounded-full border border-dashed border-gray-400 bg-white">☆☆☆</span>
            </div>
          </div>
        `;
      }

      let contentAreaHtml = '';
      if (mode === 'mixed') {
        contentAreaHtml = `
          <div class="flex-1 border-2 border-gray-700 rounded-xl p-2 flex flex-col justify-between bg-white relative">
            <div class="text-xs text-gray-500 flex justify-between items-center">
              <span>🖍️ ${z('畫(ㄏㄨㄚˋ)下(ㄒㄧㄚˋ)最(ㄗㄨㄟˋ)喜(ㄒㄧˇ)歡(ㄏㄨㄢ)的(˙ㄉㄜ)畫(ㄏㄨㄚˋ)面(ㄇㄧㄢˋ)')}</span>
            </div>
            <div class="flex-1 min-h-[82px]"></div>
            <div class="pt-1 border-t border-dotted border-gray-300">
              <div class="text-xs text-gray-500 mb-0.5">✏️ ${z('用(ㄩㄥˋ)注(ㄓㄨˋ)音(ㄧㄣ)寫(ㄒㄧㄝˇ)一(ㄧ)寫(ㄒㄧㄝˇ)')}：</div>
              <div class="writing-line"></div>
              <div class="writing-line"></div>
            </div>
          </div>
        `;
      } else if (mode === 'draw') {
        contentAreaHtml = `
          <div class="flex-1 border-2 border-gray-700 rounded-xl p-2 flex flex-col justify-between bg-white">
            <div class="text-xs text-gray-500">
              🖍️ ${z('畫(ㄏㄨㄚˋ)一(ㄧ)畫(ㄏㄨㄚˋ)或(ㄏㄨㄛˋ)寫(ㄒㄧㄝˇ)一(ㄧ)寫(ㄒㄧㄝˇ)書(ㄕㄨ)裡(ㄌㄧˇ)的(˙ㄉㄜ)內(ㄋㄟˋ)容(ㄖㄨㄥˊ)')}：
            </div>
            <div class="flex-1 min-h-[110px]"></div>
            <div class="pt-1 flex items-end gap-1 text-sm">
              <span class="shrink-0 text-xs text-gray-600">✏️ ${z('我(ㄨㄛˇ)想(ㄒㄧㄤˇ)說(ㄕㄨㄛ)')}：</span>
              <div class="flex-1 border-b border-dashed border-gray-400 h-5"></div>
            </div>
          </div>
        `;
      } else {
        const cells = Array(7).fill(0).map(() => `
          <div class="zhuyin-cell">
            <div class="zhuyin-cell-main"></div>
            <div class="zhuyin-cell-side"></div>
          </div>
        `).join('');
        contentAreaHtml = `
          <div class="flex-1 border-2 border-gray-700 rounded-xl p-2 flex flex-col justify-between bg-white">
            <div class="text-xs text-gray-500">
              🖍️ ${z('畫(ㄏㄨㄚˋ)出(ㄔㄨ)故(ㄍㄨˋ)事(ㄕˋ)畫(ㄏㄨㄚˋ)面(ㄇㄧㄢˋ)')}：
            </div>
            <div class="flex-1 min-h-[70px]"></div>
            <div class="pt-1">
              <div class="text-xs text-gray-500 mb-1">✏️ ${z('拼(ㄆㄧㄣ)音(ㄧㄣ)小(ㄒㄧㄠˇ)紀(ㄐㄧˋ)錄(ㄌㄨˋ)')}：</div>
              <div class="zhuyin-grid-row mb-1">${cells}</div>
              <div class="zhuyin-grid-row">${cells}</div>
            </div>
          </div>
        `;
      }

      return `
        <div class="border-2 border-gray-800 rounded-2xl p-3 flex flex-col justify-between bg-white h-full">
          <div class="flex items-center justify-between border-b border-gray-300 pb-1.5 mb-1.5">
            <div class="inline-flex items-center gap-1 bg-gray-100 border border-gray-400 rounded-full px-2.5 py-0.5 text-sm font-bold text-gray-900">
              <span>📖</span>
              <span>${z('第(ㄉㄧˋ)')}${numZh}${z('本(ㄅㄣˇ)')}</span>
            </div>
            <div class="text-xs text-gray-700 font-semibold">
              ____${z('月(ㄩㄝˋ)')}____${z('日(ㄖˋ)')}
            </div>
          </div>

          <div class="flex items-end gap-1 mb-2 text-sm">
            <span class="font-bold shrink-0 text-gray-900">${z('書(ㄕㄨ)名(ㄇㄧㄥˊ)')}：</span>
            <div class="flex-1 border-b-2 border-gray-700 h-6"></div>
          </div>

          <div class="mb-2">
            ${ratingHtml}
          </div>

          ${contentAreaHtml}

          <div class="flex items-end gap-1.5 mt-2 pt-1.5 border-t border-gray-200 text-xs text-gray-800">
            <span class="font-bold shrink-0">🗣️ ${z('和(ㄏㄢˋ)同(ㄊㄨㄥˊ)學(ㄒㄩㄝˊ)分(ㄈㄣ)享(ㄒㄧㄤˇ)，請(ㄑㄧㄥˇ)同(ㄊㄨㄥˊ)學(ㄒㄩㄝˊ)簽(ㄑㄧㄢ)名(ㄇㄧㄥˊ)')}：</span>
            <div class="flex-1 border-b-2 border-gray-700 h-6"></div>
          </div>
        </div>
      `;
    }

    function renderSheet() {
      const mode = document.getElementById('modeSelect').value;
      const ratingType = document.getElementById('ratingSelect').value;
      const cutMode = document.getElementById('cutSelect').value;
      const container = document.getElementById('worksheet');

      const cards = [0, 1, 2, 3].map(i => renderCard(i, mode, ratingType));

      const gridClass = cutMode === 'cut'
        ? 'grid grid-cols-2 grid-rows-2 gap-5 flex-1 relative'
        : 'grid grid-cols-2 grid-rows-2 gap-3.5 flex-1';

      const cutLinesHtml = cutMode === 'cut' ? `
        <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
          <div class="w-full border-t border-dashed border-gray-400"></div>
        </div>
        <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
          <div class="h-full border-l border-dashed border-gray-400"></div>
        </div>
      ` : '';

      container.innerHTML = `
        <header class="flex items-center justify-between border-b-2 border-gray-800 pb-2 mb-2.5">
          <div class="flex items-center gap-2">
            <span class="text-2xl">📚</span>
            <h2 class="text-xl font-bold tracking-wide text-gray-900">
              ${z('小(ㄒㄧㄠˇ)小(ㄒㄧㄠˇ)閱(ㄩㄝˋ)讀(ㄉㄨˊ)紀(ㄐㄧˋ)錄(ㄌㄨˋ)單(ㄉㄢ)')}
            </h2>
          </div>
          <div class="flex items-end gap-3 text-sm font-semibold text-gray-900">
            <div>
              ${z('一(ㄧ)年(ㄋㄧㄢˊ)')}____${z('班(ㄅㄢ)')}
            </div>
            <div>
              ____${z('號(ㄏㄠˋ)')}
            </div>
            <div class="flex items-end">
              <span>${z('姓(ㄒㄧㄥˋ)名(ㄇㄧㄥˊ)')}：</span>
              <span class="inline-block w-24 border-b-2 border-gray-800"></span>
            </div>
          </div>
        </header>

        <main class="${gridClass}">
          ${cutLinesHtml}
          ${cards.join('')}
        </main>

        <footer class="mt-2 pt-1.5 border-t border-gray-300 flex items-center justify-between text-xs text-gray-700">
          <div>
            🌟 ${z('讀(ㄉㄨˊ)完(ㄨㄢˊ)四(ㄙˋ)本(ㄅㄣˇ)書(ㄕㄨ)並(ㄅㄧㄥˋ)和(ㄏㄢˋ)同(ㄊㄨㄥˊ)學(ㄒㄩㄝˊ)分(ㄈㄣ)享(ㄒㄧㄤˇ)，就(ㄐㄧㄡˋ)是(ㄕˋ)超(ㄔㄠ)級(ㄐㄧˊ)閱(ㄩㄝˋ)讀(ㄉㄨˊ)小(ㄒㄧㄠˇ)達(ㄉㄚˊ)人(ㄖㄣˊ)喔(ㄛ)！')}
          </div>
          <div class="font-semibold">
            🏆 ${z('老(ㄌㄠˇ)師(ㄕ)認(ㄖㄣˋ)證(ㄓㄥˋ)')}：__________________
          </div>
        </footer>
      `;
    }

    renderSheet();
  </script>
</body>
</html>
